[program:gemma-reasoning]
; The directory where your project lives in Lightning AI
directory=/teamspace/studios/this_studio

; The command to start your FastAPI server
; Lightning AI provides Python natively, so we just use the system python
command=python -m uvicorn server:app --host 0.0.0.0 --port 8000

; Restart the process if it crashes
autostart=true
autorestart=true

; User to run the process as (Lightning AI uses 'zeus' user by default)
user=zeus

; Log files (Lightning AI gives full permissions inside /teamspace/)
stdout_logfile=/teamspace/studios/this_studio/out.log
stderr_logfile=/teamspace/studios/this_studio/err.log

; Optional environment variables can go here
; environment=OLLAMA_BASE_URL="http://localhost:11434/v1"
