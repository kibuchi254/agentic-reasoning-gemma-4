[supervisord]
logfile=/teamspace/studios/this_studio/supervisord.log
pidfile=/teamspace/studios/this_studio/supervisord.pid
nodaemon=false

[unix_http_server]
file=/teamspace/studios/this_studio/supervisor.sock

[supervisorctl]
serverurl=unix:///teamspace/studios/this_studio/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:gemma-reasoning]
directory=/teamspace/studios/this_studio
command=python -m uvicorn server:app --host 0.0.0.0 --port 8001
autostart=true
autorestart=true
stdout_logfile=/teamspace/studios/this_studio/out.log
stderr_logfile=/teamspace/studios/this_studio/err.log

[program:cloudflare-tunnel]
directory=/teamspace/studios/this_studio
command=cloudflared tunnel --url http://localhost:8001 run gemma-ai
autostart=true
autorestart=true
stdout_logfile=/teamspace/studios/this_studio/tunnel_out.log
stderr_logfile=/teamspace/studios/this_studio/tunnel_err.log
