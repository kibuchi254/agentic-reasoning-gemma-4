name: Deploy to Lightning AI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        env:
          WEBHOOK_URL: ${{ secrets.LIGHTNING_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.LIGHTNING_WEBHOOK_SECRET }}
        run: |
          echo "Triggering deployment webhook..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBHOOK_SECRET")
          
          # Extract the HTTP status code
          http_status=$(echo "$response" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          # The body is everything before HTTP_STATUS:
          body=$(echo "$response" | sed -e 's/HTTP_STATUS\:.*//g')
          
          echo "Response Body: $body"
          echo "Response Status: $http_status"
          
          if [ "$http_status" -ne 200 ]; then
            echo "Webhook failed with status $http_status"
            exit 1
          fi
          
          echo "Webhook triggered successfully!"
